name: Build APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z"; done
          ls
          test -f settings.gradle.kts || { echo "ERROR: project files not found in repo root. Upload project.zip to the main page of the repo."; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
